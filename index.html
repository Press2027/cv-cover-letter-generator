<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Pressmash professional CV and cover letter generator with AI-powered job tailoring."
  >

  <meta
    name="author"
    content="Pressmash"
  >

  <title>Pressmash — CV & Cover Letter Generator</title>
</head>

<body>

  <!-- Current Date & Time -->
  <div class="current-datetime" aria-label="Current date and time">

    <span>
      📅
      <strong id="currentDate">Loading date...</strong>
    </span>

    <span>
      🕐
      <strong id="currentTime">Loading time...</strong>
    </span>

  </div>

  <div class="section-card">
  <div class="section-head">
    <h3>Import Existing CV</h3>
  </div>

  <input
    type="file"
    id="cvUpload"
    accept=".pdf,.docx"
  >

  <button
    class="btn btn-primary"
    id="improveCvBtn"
    type="button"
  >
    ✨ AI Improve CV
  </button>

  <p class="hint">
    Upload a PDF or Word CV and Pressmash will convert it into a modern ATS-friendly resume.
  </p>
</div>

  <!-- Main Application -->
  <div id="app"></div>

  <!-- Application JavaScript -->
  <script
    type="module"
    src="/src/main.js"
  ></script>

</body>
</html>
